services:
  climate-auto-switch:
    build:
      context: ../../..
      dockerfile: homelab/services/climate-auto-switch/Dockerfile
    env_file:
      - ../../../.env
    volumes:
      - ${CLIMATE_DATA_DIR:-~/.local/state/picklehome}:/data
    environment:
      - ECOBEE_TOKEN_PATH=/data/ecobee-tokens.json
      - CLIMATE_DATA_DIR=/data
