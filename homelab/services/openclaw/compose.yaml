services:
  openclaw:
    image: ${OPENCLAW_IMAGE:?pin a version, e.g. ghcr.io/openclaw/openclaw:2026.6.11}   # full ref incl. tag
    # No `build:` key on purpose: pairing `image:` with `build:` makes `docker compose pull`
    # ambiguous about whether to pull or build. We don't ship a Dockerfile, so omitting `build:`
    # keeps `docker compose pull` unambiguous — it only ever pulls the named image.
    restart: unless-stopped
    user: "1000:1000"                      # image default (node); data dir isn't shared, so 1000 is fine
    environment:
      OPENCLAW_GATEWAY_BIND: lan            # NOT loopback — see homelab/services/openclaw/README.md "Port & bind topology"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?required}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:?required}          # ollama-cloud is a built-in provider, no custom config needed
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?required}  # embeddings only — Ollama Cloud doesn't support them
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?required}          # web_search (gemini provider) — see openclaw.tools.json5
      OPENCLAW_ALLOWED_CHAT_IDS: ${OPENCLAW_ALLOWED_CHAT_IDS:?required}
      # Optional (not :?required): the workspace-git-sync cron job's GIT_ASKPASS
      # helper reads this to auth git-over-HTTPS in-container (no ssh client in
      # this image). Empty until provisioned -- deploy.sh degrades to no-sync-wiring
      # with a warning if unset, same as OPENCLAW_WORKSPACE_DEPLOY_KEY_B64.
      OPENCLAW_WORKSPACE_GITHUB_TOKEN: ${OPENCLAW_WORKSPACE_GITHUB_TOKEN:-}
      # Placeholder only -- satisfies the bundled goplaces skill's env-presence gate,
      # which is evaluated gateway-host-only (see docs/setup-notes.md's "goplaces
      # node" section in the pickleclaw repo). The real key lives only in the
      # goplaces-node service's own environment.
      GOOGLE_PLACES_API_KEY: "placeholder-real-key-lives-on-goplaces-node"
      OPENCLAW_EXTRA_MOUNTS: "/srv/data/openclaw/bin:/opt/tools:ro"   # tools dir, read-only
      PATH: "/opt/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"  # live-tested: PATH additions picked up with no gateway restart
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      - config:/home/node/.openclaw                                            # writable — onboarding creates openclaw.json here
      - workspace:/home/node/.openclaw/workspace
      - auth:/home/node/.config/openclaw
      - ./openclaw.tools.json5:/home/node/.openclaw/includes/tools.json5:ro     # symlinked from the private pickleclaw repo, not committed here
      - ./openclaw.mcp.json5:/home/node/.openclaw/includes/mcp.json5:ro         # symlinked from the private pickleclaw repo, not committed here
    networks:
      default:
        # OpenClaw's node client refuses plaintext ws:// to a bare compose
        # service name (no DNS resolution is performed to check if it's
        # actually private -- see vendor/openclaw's isTrustedPlaintextWebSocketHost
        # in the pickleclaw repo's vendored source, src/gateway/net.ts). A
        # hostname ending in .local is trusted without needing the
        # OPENCLAW_ALLOW_INSECURE_PRIVATE_WS break-glass env var -- same
        # mechanism that let the dev-VM's openclaw.orb.local connect over
        # plain ws:// with no extra flag.
        aliases:
          - openclaw.local

  goplaces-node:
    build:
      context: ./goplaces-node
    restart: unless-stopped
    # Start-order only, not a readiness guarantee -- the node retries its own
    # connection (restart: unless-stopped) until the gateway's actually up.
    depends_on:
      - openclaw
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?required}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:?required}
      # Overrides the Dockerfile's baked-in default (plain "openclaw") -- see
      # the openclaw service's own "networks" comment above for why the
      # .local suffix matters here.
      OPENCLAW_NODE_HOST: openclaw.local
    volumes:
      - goplaces_node_state:/root/.openclaw

  gog-mcp:
    build:
      context: /opt/pickleclaw/nodes/gog-mcp
    restart: unless-stopped
    depends_on:
      - openclaw
    environment:
      GOG_MCP_TOKEN: ${GOG_MCP_TOKEN:?required}
      GOG_KEYRING_PASSWORD: ${GOG_KEYRING_PASSWORD:?required}
    volumes:
      - gog_mcp_keyring:/root/.local/share/gogcli

volumes:
  config:
  workspace:
  auth:
  goplaces_node_state:
  gog_mcp_keyring:
