# shellcheck shell=bash disable=SC2034
# Sourced by collect, so this is bash. The env overrides exist for tests.
HOST=picklelab
OUT=${HOST_STATE_OUT:-/var/lib/host-state/picklelab.json}
CHECK_DIR=${HOST_STATE_CHECK_DIR:-/var/lib/host-state/checks}
CHECKS=""
for f in "$CHECK_DIR"/*; do
  [ -e "$f" ] && CHECKS+="${f##*/} "
done
