services:
  github-actions-runner:
    image: myoung34/github-runner:latest
    restart: unless-stopped
    # Secrets reach the container via `environment:` interpolation, resolved by the
    # systemd unit's `op run` wrap from .env.op.template into the process env --
    # never env_file:, which reads a literal file off disk and is inert against
    # that injection (Task 4/5 finding; see
    # homelab/services/climate-auto-switch/deploy.sh).
    environment:
      - REPO_URL=${GITHUB_RUNNER_REPO_URL:?required}
      - RUNNER_TOKEN=${GITHUB_RUNNER_TOKEN:?required}
      - RUNNER_NAME=picklelab
      - RUNNER_SCOPE=repo
      - LABELS=self-hosted,linux,picklelab
      - DISABLE_AUTO_UPDATE=true
      # Survive reboots without a fresh registration token: persist the runner's
      # config files (.runner/.credentials) in a volume and reuse them on restart.
      # This mirrors GitHub's official runner-as-a-service model (register once,
      # reuse stored credentials). The registration token is then a one-time
      # bootstrap, not an ongoing credential. Both vars below are required:
      #   - CONFIGURED_ACTIONS_RUNNER_FILES_DIR: entrypoint copies the runner
      #     config dotfiles to/from this dir and skips config.sh when .runner exists.
      #   - DISABLE_AUTOMATIC_DEREGISTRATION: otherwise the container deregisters
      #     the runner on stop, wiping the persisted credentials.
      - CONFIGURED_ACTIONS_RUNNER_FILES_DIR=/runner-config
      - DISABLE_AUTOMATIC_DEREGISTRATION=true
    volumes:
      # NOTE: no /var/run/docker.sock mount. pirpg CI is Node/npm and doesn't
      # need Docker. Mount it (- /var/run/docker.sock:/var/run/docker.sock) only
      # if a workflow needs Docker on the runner: building/pushing images,
      # docker-in-docker, container-based actions (`uses:` that run in a
      # container), or `services:` containers in a job. That grants CI jobs
      # root-equivalent host access, so add it back deliberately.
      - runner-config:/runner-config

volumes:
  runner-config:
