services:
  db:
    volumes:
      - /srv/data/vikunja/db:/var/lib/postgresql/data

  vikunja:
    env_file:
      - /opt/homelab/.env
    ports:
      # Bound to loopback only: tailscale serve proxies from vikunja.<tailnet>.ts.net to here
      - "127.0.0.1:3456:3456"
    volumes:
      - /srv/data/vikunja/files:/app/vikunja/files
