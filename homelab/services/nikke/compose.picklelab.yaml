services:
  serve:
    # The image nikke-roster-scanner's Woodpecker pipeline publishes for each main commit
    # (private package, pulled as root by compose-pull@nikke). deploy.sh writes IMAGE_SHA
    # to .env.image and the units load it. Nothing builds on the host.
    image: ghcr.io/technicalpickles/nikke:${IMAGE_SHA:?required}
    env_file:
      - .env.build
    ports:
      # Loopback only. tailscale serve proxies from nikke.<tailnet>.ts.net.
      - "127.0.0.1:${NIKKE_PORT:?set by deploy.sh}:${NIKKE_PORT:?set by deploy.sh}"
    volumes:
      - /srv/data/nikke:/data

  sync:
    # Same image as serve. The base compose file's `pull_policy: never` stays: serve's pull
    # has already put the image on disk, so a timer run never needs the registry.
    image: ghcr.io/technicalpickles/nikke:${IMAGE_SHA:?required}
    env_file:
      - .env.build
    volumes:
      - /srv/data/nikke:/data
