services:
  rpg:
    image: obsidian-sync
    build: .
    init: true
    restart: unless-stopped
    volumes:
      - ob-config-rpg:/root/.config
      - rpg:/vault

  pickled-knowledge:
    image: obsidian-sync
    init: true
    restart: unless-stopped
    volumes:
      - ob-config-pickled-knowledge:/root/.config
      - pickled-knowledge:/vault

volumes:
  ob-config-rpg:
  ob-config-pickled-knowledge:
  rpg:
  pickled-knowledge:
