services:
  rpg:
    # Published by CI (private package, pulled via the root credential helper).
    # deploy.sh writes IMAGE_SHA to .env.image; obsidian-sync.service loads it.
    image: ghcr.io/technicalpickles/picklehome-obsidian-sync:${IMAGE_SHA:?required}
    user: "1000:1000"
    init: true
    restart: unless-stopped
    volumes:
      - ob-config-rpg:/home/node/.config
      - rpg:/vault

  pickled-knowledge:
    image: ghcr.io/technicalpickles/picklehome-obsidian-sync:${IMAGE_SHA:?required}
    user: "1000:1000"
    init: true
    restart: unless-stopped
    volumes:
      - ob-config-pickled-knowledge:/home/node/.config
      - pickled-knowledge:/vault

volumes:
  ob-config-rpg:
  ob-config-pickled-knowledge:
  rpg:
  pickled-knowledge:
