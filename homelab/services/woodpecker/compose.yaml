services:
  # Secrets across this stack (TS_AUTHKEY, GITHUB_CLIENT/SECRET, AGENT_SECRET) reach
  # their containers via `environment:` interpolation, resolved by the systemd unit's
  # `op run` wrap from .env.op.template into the process env -- never env_file:,
  # which reads a literal file off disk and is inert against that injection (Task
  # 4/5 finding; see homelab/services/climate-auto-switch/deploy.sh). All three
  # containers here are started by ONE `docker compose up` invocation on the host's
  # normal (root) dockerd -- the separate rootless `ci`-user dockerd is only where
  # woodpecker-agent later spawns CI *step* containers via DOCKER_HOST, not how this
  # stack's own containers get their initial environment -- so the same single
  # op-run wrap on the woodpecker.service unit covers the agent's secret too.
  ts-woodpecker:
    image: tailscale/tailscale:latest
    hostname: woodpecker                       # -> woodpecker.tail2023b7.ts.net
    environment:
      - TS_AUTHKEY=${WOODPECKER_TS_AUTHKEY:?required}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true                       # HTTP-only Funnel: no NET_ADMIN, no tun
      - TS_EXTRA_ARGS=--advertise-tags=tag:ci
      - TS_SERVE_CONFIG=/config/funnel.json
    volumes:
      - ./funnel.json:/config/funnel.json:ro
    restart: unless-stopped

  woodpecker-server:
    # Woodpecker removed the :latest tag deliberately (prevents accidental major
    # upgrades). v3 = rolling latest-v3.x; with `up --pull always` we get patches
    # and minors each deploy, never a major.
    # https://woodpecker-ci.org/docs/administration/general#container-images
    image: woodpeckerci/woodpecker-server:v3
    network_mode: service:ts-woodpecker
    depends_on: [ts-woodpecker]
    environment:
      - WOODPECKER_HOST=https://woodpecker.tail2023b7.ts.net
      - WOODPECKER_GITHUB=true
      - WOODPECKER_GITHUB_CLIENT=${WOODPECKER_GITHUB_CLIENT:?required}
      - WOODPECKER_GITHUB_SECRET=${WOODPECKER_GITHUB_SECRET:?required}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET:?required}
      - WOODPECKER_REPO_OWNERS=technicalpickles
      - WOODPECKER_ADMIN=technicalpickles
      - WOODPECKER_OPEN=false
    restart: unless-stopped

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3        # keep in lockstep with the server major
    network_mode: service:ts-woodpecker
    depends_on: [woodpecker-server]
    user: "2000:2000"                           # the ci uid, to access the rootless socket
    environment:
      - WOODPECKER_SERVER=localhost:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET:?required}
      - WOODPECKER_MAX_WORKFLOWS=2
      - DOCKER_HOST=unix:///rootless/docker.sock
    restart: unless-stopped

  # Steers CI to the laptop VM agent while it is online (see README "Agent
  # switch"). Not part of the long-running stack: profile-gated, run once per
  # tick by woodpecker-agent-switch.timer via `docker compose --profile switch
  # run --rm --no-deps`. Shares ts-woodpecker's netns so the API is localhost:8000.
  # WOODPECKER_API_TOKEN deliberately has no `:?required`: compose interpolates
  # every service (profile or not) when woodpecker.service runs `up`, so a
  # required var that is not yet in .env.op.template would break the whole stack.
  # The script itself exits 1 with a clear message when the token is unset.
  # The two agent names are placeholders until checked against the live agent
  # list (Settings, Agents); a wrong picklelab name fails loudly, a wrong laptop
  # name fails open to picklelab.
  woodpecker-agent-switch:
    build:
      context: .
      dockerfile: Dockerfile.agent-switch
    profiles: [switch]
    network_mode: service:ts-woodpecker
    environment:
      - WOODPECKER_URL=http://127.0.0.1:8000
      - WOODPECKER_API_TOKEN=${WOODPECKER_API_TOKEN:-}
      - LAPTOP_AGENT_NAME=woodpecker-agent-vm
      - PICKLELAB_AGENT_NAME=picklelab
      - STALE_AFTER_SECONDS=300
