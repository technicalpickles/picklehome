services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brineworks"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: brineworks
      POSTGRES_PASSWORD: ${BRINEWORKS_DB_PASSWORD}
      POSTGRES_DB: brineworks
    volumes:
      - db-data:/var/lib/postgresql/data

  server:
    image: brineworks-server:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Healthcheck is defined in the brineworks Dockerfile (python -m brineworks_server.healthcheck).
    environment:
      BRINEWORKS_ENV: production
      BRINEWORKS_SERVER_PORT: ${BRINEWORKS_SERVER_PORT:?BRINEWORKS_SERVER_PORT must be exported (deploy.sh sets it)}
      BRINEWORKS_DATABASE_URL: postgresql+asyncpg://brineworks:${BRINEWORKS_DB_PASSWORD}@db:5432/brineworks
      BRINEWORKS_API_KEY: ${BRINEWORKS_API_KEY}

volumes:
  db-data:
