services:
  db:
    volumes:
      - /srv/data/brineworks-server/db:/var/lib/postgresql/data

  server:
    build:
      context: /opt/brineworks/server
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${BRINEWORKS_GIT_SHA:-unknown}
    env_file:
      - /opt/homelab/.env
      - .env.build
    # Identity auth, enabled 2026-08-17 after phase 1 (sha 95244bf) verified healthy.
    # Neither value is a secret, which is why they sit here rather than in 1Password.
    # To back this out: re-comment both lines and redeploy. No code rollback needed.
    # Setting the trust flag while ALLOWED_LOGINS is empty makes the server refuse to
    # start, on purpose -- see this service's README.
    environment:
      BRINEWORKS_TRUST_TAILSCALE_HEADERS: "true"
      BRINEWORKS_ALLOWED_LOGINS: joshua.nichols@gmail.com
    ports:
      # Bound to loopback only -- tailscale serve proxies from brineworks.<tailnet>.ts.net.
      # BRINEWORKS_SERVER_PORT is set by deploy.sh (which defaults it to 8765).
      #
      # THE 127.0.0.1 PREFIX IS LOAD-BEARING FOR AUTHENTICATION, not just network hygiene.
      # The server trusts Tailscale Serve's identity headers (Tailscale-User-Login) as an
      # auth path. Serve overwrites those headers on traffic it proxies, so they cannot be
      # spoofed through it -- but anything that can reach this port WITHOUT going through
      # Serve can set them itself and authenticate as anyone. Verified 2026-08-16: the
      # header sent straight to the loopback port arrives verbatim. Publishing this on
      # 0.0.0.0, or adding a second ingress, turns identity auth into an impersonation
      # hole. See brineworks docs/decisions/0007-tailscale-identity-auth.md (spike finding
      # #3) and the BRINEWORKS_TRUST_TAILSCALE_HEADERS note in this service's README.
      - "127.0.0.1:${BRINEWORKS_SERVER_PORT:?set by deploy.sh}:${BRINEWORKS_SERVER_PORT:?set by deploy.sh}"
