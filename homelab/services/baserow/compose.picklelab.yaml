services:
  db:
    volumes:
      - /srv/data/baserow/db:/var/lib/postgresql/data

  baserow:
    env_file:
      - /opt/homelab/.env
    ports:
      # Bound to loopback only — tailscale serve proxies from baserow.<tailnet>.ts.net to here
      - "127.0.0.1:8080:80"
    volumes:
      - /srv/data/baserow/data:/baserow/data
