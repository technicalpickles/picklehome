# Save resurrect sessions to /data so they survive container redeploys
set -g @resurrect-dir '/data/tmux-resurrect'

# Auto-save every 15 minutes and restore on tmux start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

run-shell /usr/local/lib/tmux-resurrect/resurrect.tmux
run-shell /usr/local/lib/tmux-continuum/continuum.tmux
