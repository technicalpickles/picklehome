services:
  # Tailscale node sidecar. Makes the agent a first-class tailnet node so mosh's
  # UDP flows natively over WireGuard (tailscale serve is TCP-only and cannot
  # carry it). Replaces the serve/Service/loopback wiring. Rationale + rejected
  # alternatives: brineworks repo ADR 0006, and homelab/services/README.md
  # "container-as-node".
  ts-agent:
    # Pinned, not :latest. A `docker rmi && pull` of :latest once drifted the
    # image to a newer containerboot whose generated `tailscale up` no longer
    # restated a non-default pref in the persisted node state, so `up` refused
    # the partial reconfigure and the sidecar crash-looped. Bump deliberately.
    image: tailscale/tailscale:v1.98.4
    hostname: brineworks-agent          # MagicDNS name -- same as the old Service
    env_file:
      - .env                            # supplies TS_AUTHKEY (filtered into .env)
    environment:
      - TS_STATE_DIR=/var/lib/tailscale  # node identity persists across recreates
      - TS_USERSPACE=false               # kernel/TUN mode: required for mosh UDP
      # --reset makes `tailscale up` take the default for any flag not stated
      # here, so a containerboot version bump can't deadlock on "must mention all
      # non-default flags" against the persisted state. Idempotent across recreates.
      - TS_EXTRA_ARGS=--reset --advertise-tags=tag:server
    volumes:
      - /srv/data/brineworks-agent/ts-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin                        # NET_ADMIN only, not --privileged
    restart: unless-stopped

  agent:
    build:
      # Build context is the whole brineworks repo (the image bakes it into
      # /opt/brineworks); the agent image lives at agent/Dockerfile. deploy.sh
      # keeps /opt/brineworks fast-forwarded to main, lockstep with the server.
      context: /opt/brineworks
      dockerfile: agent/Dockerfile
    # Share the ts-agent node's network namespace: the agent's sshd (:22) and
    # mosh-server's UDP land on the node's tailnet interface directly. No `ports:`
    # block -- nothing is published to the host; reach the agent at
    # brineworks-agent.<tailnet> over the tailnet.
    network_mode: service:ts-agent
    depends_on:
      - ts-agent
    # Filtered service secrets ONLY (KEYRING_CRYPTFILE_PASSWORD, BRINEWORKS_API_KEY).
    # Deliberately NOT /opt/homelab/.env: this container runs arbitrary Claude
    # sessions, so it must not receive the whole homelab secret set
    # (cf. github-actions-runner, homelab/services/README.md).
    env_file:
      - .env
    volumes:
      - /srv/data/brineworks-agent:/data
