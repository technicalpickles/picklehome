# Installed to /etc/needrestart/conf.d/ by homelab/scripts/setup-needrestart.sh.
#
# The stock config already skips docker. Restarting containerd under a running
# dockerd (containerd image store) leaves dockerd unable to find its own
# containers until docker restarts too, so skip containerd the same way.
# host-state's runtime-docker check warns while either daemon runs on replaced
# libraries, and goes critical if containerd restarts under dockerd anyway.
$nrconf{override_rc}{qr(^containerd)} = 0;
