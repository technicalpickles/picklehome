# Installed to /etc/ssh/sshd_config.d/20-root-login.conf by homelab/scripts/setup-root-key.sh.
# Sorts before 50-cloud-init.conf; sshd keeps the first value it reads.
#
# prohibit-password is the default, stated so it survives a distro change.
# AuthorizedKeysFile drops the default's .ssh/authorized_keys2, a second path
# setup-root-key.sh would otherwise have to police.
PermitRootLogin prohibit-password
AuthorizedKeysFile .ssh/authorized_keys
