[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecobee"]

[project]
name = "picklehome-ecobee"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-ecobee-api==0.3.2",
    "keyring>=24",
    "pyyaml>=6",
]
