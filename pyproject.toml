[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["climate", "network"]

[project]
name = "picklehome"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # climate
    "python-ecobee-api==0.3.2",
    "keyring>=24",
    "pyyaml>=6",
    "aioambient==2024.08.0",
    # network
    "requests>=2.32",
    "python-dotenv>=1.0",
    "playwright>=1.40",
    "paramiko>=3.0",
    "dnspython>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
