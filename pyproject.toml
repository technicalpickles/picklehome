[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["climate", "network", "lighting", "garage"]

[project]
name = "picklehome"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # climate
    "python-ecobee-api==0.3.2",
    "pyyaml>=6",
    "aioambient==2024.08.0",
    "blueair-api>=1.48",
    # network
    "requests>=2.32",
    "python-dotenv>=1.0",
    "playwright>=1.40",
    "paramiko>=3.0",
    "dnspython>=2.6",
    "mac-vendor-lookup>=0.1.12",
    # lighting
    "pylutron-caseta>=0.21",
    "aiohue>=4.7",
    # garage
    "genie-partner-sdk>=1.0.11",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
