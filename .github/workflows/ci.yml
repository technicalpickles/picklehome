name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read uv version from .mise.toml
        id: uv
        run: echo "version=$(sed -n 's/^uv = { version = "\([^"]*\)".*/\1/p' .mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests

  # Pull requests build only the images whose inputs changed, so a broken Dockerfile
  # fails the PR instead of the deploy on picklelab. A newer push to the same PR cancels
  # the stale run: only the latest head matters.
  images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: images-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR checks out a merge commit; depth 2 brings its first parent (the base),
          # so `HEAD^1` is the diff base for --changed-since.
          fetch-depth: 2
      - run: scripts/check-images --changed-since HEAD^1

  # Pushes to main publish every image to GHCR tagged by commit SHA, but only after the
  # tests pass, so a tag never exists for a commit CI rejected. Deliberately no
  # `concurrency` here: GitHub drops older *pending* runs in a group even without
  # cancel-in-progress, and a dropped commit would never get its tags, so a deploy
  # waiting on that SHA would hang. The only shared state is the :buildcache tag, where
  # last writer wins and a stale cache costs time, not correctness.
  publish-images:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up buildx (registry layer cache needs the docker-container driver)
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/check-images --push "$GITHUB_SHA"
